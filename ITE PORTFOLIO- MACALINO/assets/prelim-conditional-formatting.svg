  <rect x="64" y="690" width="1072" height="74" rx="8" fill="#dfe8cb"/>
  <text x="96" y="740" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#4e6141">COURSEWORK PREVIEW · ITC C503</text>

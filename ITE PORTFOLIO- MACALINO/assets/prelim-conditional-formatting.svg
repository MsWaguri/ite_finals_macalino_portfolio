<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Prelim Activity No. 1</title>
  <desc id="desc">Coursework preview card for the Conditional Formatting and Filtering activity.</desc>
  <rect width="1200" height="700" fill="#f3f2ef"/>
  <rect x="26" y="26" width="1148" height="648" rx="14" fill="#f3f2ef" stroke="#d9d9d4"/>
  <text x="64" y="124" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#262725">PRELIM ACTIVITY NO. 1</text>
  <text x="64" y="190" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#4d514a">Conditional Formatting &amp; Filtering</text>
  <line x1="64" y1="230" x2="1136" y2="230" stroke="#d7d8d3" stroke-width="2"/>
  <text x="64" y="310" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#232720">TASK CHECKLIST</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2f342f">
    <text x="90" y="378">✓ Apply highlight, top/bottom, data bar, color scale, and duplicate-value rules</text>
